<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คลังข้อสอบและแบบฝึกหัด Interactive</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8F9FE;
      color: #2D3748;
      padding: 30px 16px;
      line-height: 1.6;
    }
    .container {
      max-width: 620px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 26px;
    }
    header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1A365D;
      margin-bottom: 6px;
    }
    header p {
      font-size: 14.5px;
      color: #718096;
    }
    .section-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      border: 1.5px solid #E2E8F0;
    }
    .section-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-p4 { color: #DD6B20; }
    .title-p6 { color: #3182CE; }
    
    .quiz-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quiz-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15.5px;
      font-weight: 500;
      color: #FFFFFF;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .quiz-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }
    .arrow {
      font-size: 18px;
      opacity: 0.9;
    }

    .btn-math-p6   { background: linear-gradient(135deg, #2563EB, #1D4ED8); }
